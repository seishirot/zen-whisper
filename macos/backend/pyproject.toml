[project]
name = "zen-whisper-mac-backend"
version = "0.1.0"
description = "macOS native backend for zen-whisper"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
mlx = [
    "huggingface-hub>=1.21,<2",
    "mlx-whisper>=0.4,<1.0",
    "mlx-audio>=0.4,<0.5",
]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zen_whisper_mac_backend"]

[tool.hatch.build.targets.wheel.force-include]
"src/zen_whisper_mac_backend/resources/model_registry.json" = "zen_whisper_mac_backend/resources/model_registry.json"

[project.scripts]
zen-whisper-mac-backend = "zen_whisper_mac_backend.server:main"

[tool.uv]
required-version = "==0.11.32"
preview-features = ["audit-command", "json-output", "malware-check"]
exclude-newer = "1 week"
# Minimum versions for transitive dependencies with published advisories.
# Raise a floor here when fixing a Dependabot security alert (security/README.md).
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "idna>=3.15",
    "msgpack>=1.2.3",
    "pillow>=13.0.0",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "setuptools>=84.1.0",
    "urllib3>=2.8.0",
]
build-constraint-dependencies = ["hatchling==1.31.0"]

[tool.uv.audit]
malware-check = true
