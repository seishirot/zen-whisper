[project]
name = "zen-whisper-mac-backend"
version = "0.1.0"
description = "macOS native backend for zen-whisper"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4,<1.0",
    "mlx-audio>=0.4,<0.5",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zen_whisper_mac_backend"]

[tool.hatch.build.targets.wheel.force-include]
"src/zen_whisper_mac_backend/resources/model_registry.json" = "zen_whisper_mac_backend/resources/model_registry.json"

[project.scripts]
zen-whisper-mac-backend = "zen_whisper_mac_backend.server:main"
