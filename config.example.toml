[hotkey]
# Key combinations for toggling recording (string or list)
# "win" is automatically interpreted as "cmd" on macOS
toggle = ["shift+space"]
# Optional: alternate toggle. When this stops recording, ZenWhisper pastes and presses Enter.
# For safety, any CLI postprocessor result is pasted without automatically pressing Enter.
# Recommended for chat boxes: "ctrl+shift+space"
# submit_toggle = "ctrl+shift+space"
# Key combination for switching language
switch_lang = "shift+alt+space"

[recognition]
# Optional Windows backend: engine = "crispasr" (default remains whisper).
# Setup: mise exec -- uv run --no-sync python tools/setup_crispasr.py --runtime cpu --model parakeet-ja-0.6b-q8
# crispasr_root = "tools/bin/crispasr/v0.8.32"
# crispasr_model = "parakeet-ja-0.6b-q8"
# crispasr_decoder = "auto" # auto / tdt / ctc; only supported profile decoders
# cuda_gpu_uuid = "" # Choose by name in Settings > Recognition or the tray GPU menu.
# crispasr_gpu_device = 0 # Legacy CrispASR index, only used when cuda_gpu_uuid is empty.
# crispasr_timeout_sec = 120
# crispasr_max_tokens = 512
# Language for transcription ("ja", "en", etc.)
language = "ja"
# Engine: "whisper", "reazon-k2", "qwen3-asr", or optional "crispasr" (Windows)
engine = "whisper"
# Whisper model size (e.g., "large-v3-turbo", "medium", "small", "base", "tiny").
# Built-ins resolve to reviewed full commits. A custom model must be an existing
# local directory or owner/model@40-lowercase-hex-commit; mutable remote IDs fail.
# Custom sources are user-managed and do not use ZenWhisper's artifact hashes.
model_size = "large-v3-turbo"
# Compute type ("float16", "int8", etc.)
compute_type = "float16"
beam_size = 5
# CPU threads for faster-whisper when device resolves to CPU
cpu_threads = 4
# Warn after this many seconds. Native model loads cannot be cancelled safely,
# so ZenWhisper keeps waiting and serializes later model changes.
model_load_timeout_sec = 300
# ReazonSpeech K2 fast mode (requires: uv sync --locked --extra reazon)
# Only "ja" has an approved snapshot. Legacy "ja-en" is migrated to pinned "ja".
reazon_language = "ja"
reazon_precision = "int8-fp32"
# Validated Windows CPU default; set 1 for a one-setting rollback.
reazon_inference_threads = 4
reazon_chunk_sec = 25.0
reazon_trailing_silence_sec = 0.5
# Qwen3-ASR model name (tray path requires: uv sync --locked --extra qwen3-cuda)
# Use uv sync --locked --extra qwen3 only for manual CPU config experiments with device = "cpu".
# Windows native Transformers 5.14 + CUDA で末尾が "-hf" のモデルを使用します。
# 旧 qwen-asr 用の "-hf" なしモデルIDは自動変換せず、選び直しを要求します。
# "Qwen/Qwen3-ASR-1.7B-hf" - 大規模・既定
# "Qwen/Qwen3-ASR-0.6B-hf" - 軽量（速度は音声や出力長に依存）
# A custom model follows the same user-managed local-directory or lowercase
# owner/model@full-commit rule and does not use ZenWhisper's artifact hashes.
# qwen3_model = "Qwen/Qwen3-ASR-1.7B-hf"
# Max tokens to generate. 256 avoids truncation observed on a 72.5-second sample.
# qwen3_max_new_tokens = 256
# Attention implementation: "auto" (FA2 があれば使用、無ければ sdpa) / "sdpa" / "flash_attention_2" / "eager"
# qwen3_attn_implementation = "auto"
# Enable generation compile (CUDA only). CPU または triton が無い環境では自動的に無効化します。
# qwen3_torch_compile = false
# Whisper device: "cuda" (Windows GPU), "cpu" (Windows CPU), or "mlx" (macOS)
# The app default is "cuda" on Windows and "mlx" on macOS when omitted.
# device = "cuda"
# Hallucination suppression: skip hallucinated text after silence (seconds)
# Set to "off" to disable this optional threshold.
hallucination_silence_threshold = 2.0
# Threshold for "no speech" probability (0.0-1.0)
no_speech_threshold = 0.6
# Use previous segment text for next inference (false to prevent hallucination chains)
condition_on_previous_text = false

[recording]
# Recording VAD uses a bundled Silero ONNX model through sherpa-onnx; Windows plain uv sync --locked does not require PyTorch.
# Microphone device name (empty string = system default).
# You can also select this from the tray menu. If the selected mic disappears,
# ZenWhisper keeps this value and falls back to the system default at runtime.
microphone = ""
# App-internal ASR/VAD processing rate. Current ASR backends require 16kHz.
# Devices that need 48kHz are opened at their stream rate and resampled to this.
sample_rate = 16000
# Stop recording after this many seconds of silence
vad_silence_threshold_sec = 10.0
# Minimum recording duration (seconds)
min_recording_sec = 0.5
# Discard near-silent recordings before ASR to prevent silence hallucinations
min_audio_rms = 0.001
min_audio_peak = 0.01
# Maximum recording duration (seconds)
max_recording_sec = 300.0
max_recording_warning_pct = 80

[output]
# Restore clipboard contents after pasting
restore_clipboard = false
# Delay before pasting (milliseconds)
paste_delay_ms = 100

[enhancement]
# Domain profile ID = filename without ".toml" in profiles/. Empty disables hints/context.
profile = ""
# "off" (default), "dictionary", or a preset ID from postprocessors*.toml.
# CLI postprocessing can send the transcript, profile context, and terms to its destination.
postprocessor = "off"

[feedback]
sound_enabled = true
# Sound type: "tone" (generated sine wave) or "custom" (file playback)
sound_type = "tone"
volume = 0.3
# Custom sound files (used when sound_type = "custom")
# Place your own audio files in assets/ directory
custom_start_sound = "assets/start.flac"
custom_stop_sound = "assets/stop.flac"

[overlay]
enabled = true
# Reserved compatibility values. The current overlay uses a fixed
# bottom-center start position and internal size regardless of these values.
position = "bottom-center"
size = 48

[logging]
# Log level: "DEBUG", "INFO", "WARNING", "ERROR"
level = "INFO"
file = "zen-whisper.log"
