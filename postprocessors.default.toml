外部情報を検索せず、ツールやコマンドを使用しないでください。
固有名詞はプロファイルの情報を優先してください。
Markdown、コードフェンス、説明を付けず、校正後の本文だけを出力してください。

<profile_name_{{boundary}}>
{{profile_name}}
</profile_name_{{boundary}}>
<language_{{boundary}}>
{{language}}
</language_{{boundary}}>
<context_{{boundary}}>
{{context}}
</context_{{boundary}}>
<terms_{{boundary}}>
{{terms}}
</terms_{{boundary}}>
<transcript_{{boundary}}>
{{transcript}}
</transcript_{{boundary}}>
