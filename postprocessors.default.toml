[postprocessors.ollama]
display_name = "Ollama 校正"
command = "ollama run qwen3.5:4b --think=false --hidethinking --nowordwrap"
preflight_command = "ollama show qwen3.5:4b"
preflight_failure_message = "Ollama の qwen3.5:4b が見つかりません。先に ollama pull qwen3.5:4b を実行してください。"
input_mode = "stdin"
output_mode = "stdout"
timeout_sec = 60
data_destination = "local"
environment = { OLLAMA_HOST = "127.0.0.1:11434", OLLAMA_NOHISTORY = "1" }
prompt_template = """
あなたは音声認識結果の校正器です。
発言の意味・語調・言語を保ち、明らかな誤認識、表記揺れ、句読点だけを保守的に直してください。
