version: 2

# Version-update PRs are disabled (open-pull-requests-limit: 0). Dependabot
# security updates, enabled in the repository settings, still open PRs for
# vulnerable dependencies and reuse the cooldown below. Routine updates are
# applied deliberately by following security/README.md.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0

  - package-ecosystem: "uv"
    directory: "/macos/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0

  - package-ecosystem: "uv"
    directory: "/security/build-audit"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
