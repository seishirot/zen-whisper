[project]
name = "zen-whisper"
version = "1.0.0"
description = "Fully local voice-to-text input tool powered by Whisper"
readme = "README.md"
license = "MIT"
authors = [
    { name = "seishirot", email = "217049440+seishirot@users.noreply.github.com" },
]
requires-python = ">=3.11,<3.14"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Utilities",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pynput>=1.7.6",
    "pyperclip>=1.8",
    "pyautogui>=0.9.54",
    "pystray>=0.19",
    "Pillow>=12.3.0",
    "scipy>=1.11",
    "soundfile>=0.12",
    "tomli-w>=1.0.0",
    "huggingface-hub>=1.21,<2",
    # VAD and Reazon use the validated sherpa-onnx pair.
    "sherpa-onnx==1.13.1",
    "sherpa-onnx-core==1.13.1",
    # Windows 専用
    "faster-whisper>=1.0.2; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    # Mac 専用
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
qwen3 = [
    "transformers>=5.14.1,<5.15",
    "torch>=2.10,<2.11",
]
qwen3-cuda = [
    "transformers>=5.14.1,<5.15",
    "torch>=2.10,<2.11",
]
cuda = [
    # Optional faster-whisper CUDA DLLs for Windows GPU installs.
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'win32'",
]
reazon = [
    "reazonspeech-k2-asr",
]

[project.urls]
Homepage = "https://github.com/seishirot/zen-whisper"
Repository = "https://github.com/seishirot/zen-whisper"
Issues = "https://github.com/seishirot/zen-whisper/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
benchmark = [
    # Public ASR corpus preparation only; never imported by the application.
    "pyarrow>=21,<22",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"assets/vad" = "assets/vad"
"postprocessors.default.toml" = "postprocessors.default.toml"
"profiles/README.md" = "profiles/README.md"
"profiles/zen-whisper.toml.example" = "profiles/zen-whisper.toml.example"
"src/model_manifest.json" = "src/model_manifest.json"
"src/crispasr_manifest.json" = "src/crispasr_manifest.json"

[project.gui-scripts]
zen-whisper = "src.launcher:main"
zen-whisper-toggle = "src.launcher:toggle_main"
zen-whisper-submit-toggle = "src.launcher:submit_toggle_main"

[tool.uv]
required-version = "==0.11.32"
preview-features = ["audit-command", "json-output", "malware-check"]
exclude-newer = "1 week"
constraint-dependencies = [
    "idna>=3.15",
    "msgpack>=1.2.1",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "urllib3>=2.7.0",
]
build-constraint-dependencies = ["hatchling==1.31.0"]
conflicts = [
    [
        { extra = "qwen3" },
        { extra = "qwen3-cuda" },
    ],
]

[tool.uv.audit]
malware-check = true
# PyTorch 2.10 is required by the validated Qwen stack and is also resolved for
# the root macOS mlx-whisper path. These exceptions are metadata-checked
# (including expiry) by tests/test_supply_chain_policy.py.
ignore = ["GHSA-rrmf-rvhw-rf47"]
ignore-until-fixed = ["PYSEC-2026-139"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "qwen3-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
reazonspeech-k2-asr = { git = "https://github.com/reazon-research/ReazonSpeech", rev = "2d4d4762e7ee294ac8e47a177ac2e9b0e8d0d43f", subdirectory = "pkg/k2-asr" }
